name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          E2E_MOCK_AUTH: "1"
          E2E_MOCK_AUTH_ALLOW_NEXT_START: "1"

      - name: Check bundle budget
        run: pnpm bundle:budget

      - name: Report bundle headroom
        run: pnpm bundle:report

      - name: Build standalone server for smoke tests
        run: pnpm build:standalone
        env:
          E2E_MOCK_AUTH: "1"
          E2E_MOCK_AUTH_ALLOW_NEXT_START: "1"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Mock smoke test
        run: pnpm test:smoke:mock

  vercel-status:
    name: Vercel status
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Report Vercel-compatible build status
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$CHECKS_RESULT" in
            success)
              state="success"
              description="Vercel-compatible build passed"
              ;;
            failure|timed_out)
              state="failure"
              description="CI checks failed"
              ;;
            cancelled|skipped)
              state="error"
              description="CI run was cancelled or skipped"
              ;;
            *)
              state="error"
              description="CI result was inconclusive: $CHECKS_RESULT"
              ;;
          esac

          gh api "repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            -f state="$state" \
            -f context="Vercel" \
            -f target_url="$RUN_URL" \
            -f description="$description"
