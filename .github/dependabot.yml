# Dependabot keeps dependencies current and opens security PRs automatically.
# The "npm" ecosystem also handles pnpm (reads pnpm-lock.yaml).
# Security updates are opened immediately, independent of the schedule below.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    # @types/node must track the deployed Node runtime major (engines.node,
    # Vercel project setting), not the newest Node release. Bump it manually
    # alongside a runtime upgrade; minor/patch bumps still flow via the group.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Batch low-risk minor/patch bumps into two PRs (prod vs dev). Major
    # updates are intentionally left ungrouped so each gets its own PR for
    # deliberate, isolated review (tooling-compat risk).
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
