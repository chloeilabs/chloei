# Run the TradingAgents sidecar locally:
#   cd tradingagents-service && cp .env.example .env && docker compose up --build
#
# Then point Chloei at it with TRADINGAGENTS_SERVICE_URL=http://localhost:8000
services:
  tradingagents:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # AI Gateway routing (shared with the Chloei web app). Set AI_GATEWAY_API_KEY
      # in .env; it is seeded into the provider key var at startup.
      TRADINGAGENTS_LLM_PROVIDER: ${TRADINGAGENTS_LLM_PROVIDER:-openrouter}
      TRADINGAGENTS_LLM_BACKEND_URL: ${TRADINGAGENTS_LLM_BACKEND_URL:-https://ai-gateway.vercel.sh/v1}
      # gpt-5.x calls tools natively; qwen3.7-max (thinking) 400s on tool_choice.
      TRADINGAGENTS_DEEP_THINK_LLM: ${TRADINGAGENTS_DEEP_THINK_LLM:-openai/gpt-5.5}
      TRADINGAGENTS_QUICK_THINK_LLM: ${TRADINGAGENTS_QUICK_THINK_LLM:-openai/gpt-5.4-mini}
      # Cross-run memory loop: keep the reflection log (and run artifacts/cache)
      # on the data volume so the desk's learning survives restarts. Set
      # TRADINGAGENTS_MEMORY_ENABLED=0 for a fully stateless service.
      TRADINGAGENTS_MEMORY_ENABLED: ${TRADINGAGENTS_MEMORY_ENABLED:-1}
      TRADINGAGENTS_MEMORY_LOG_PATH: ${TRADINGAGENTS_MEMORY_LOG_PATH:-/data/memory/trading_memory.md}
      TRADINGAGENTS_RESULTS_DIR: ${TRADINGAGENTS_RESULTS_DIR:-/data/results}
      TRADINGAGENTS_CACHE_DIR: ${TRADINGAGENTS_CACHE_DIR:-/data/cache}
    volumes:
      # Persist the memory-log, run artifacts, and data cache across restarts.
      - tradingagents-data:/data
    restart: unless-stopped

volumes:
  tradingagents-data:
