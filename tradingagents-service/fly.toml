# Fly.io deploy config for the Chloei TradingAgents sidecar.
#
# Quick start (from this directory):
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly secrets set AI_GATEWAY_API_KEY=... TRADINGAGENTS_SERVICE_TOKEN=<shared-secret>
#   fly deploy
#
# Then point the Chloei Vercel project at it:
#   TRADINGAGENTS_SERVICE_URL=https://<your-app-name>.fly.dev
#   TRADINGAGENTS_SERVICE_TOKEN=<same shared-secret>   (must match the sidecar)
#
# Secrets (the gateway key + service token) are set with `fly secrets`, never in
# this file. The service token is REQUIRED in production so the public sidecar
# only answers calls from Chloei (it makes authenticated LLM calls on your key).

app = "chloei-tradingagents"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Non-secret configuration. Models default to the gpt-5.x family because some
# gateway models (e.g. qwen3.7-max in thinking mode) reject the tool_choice the
# structured-output agents send. ALLOWED_ORIGINS is empty: Chloei proxies the
# service server-side, so no browser ever calls it directly.
[env]
  PORT = "8000"
  TRADINGAGENTS_LLM_PROVIDER = "openrouter"
  TRADINGAGENTS_LLM_BACKEND_URL = "https://ai-gateway.vercel.sh/v1"
  TRADINGAGENTS_DEEP_THINK_LLM = "openai/gpt-5.5"
  TRADINGAGENTS_QUICK_THINK_LLM = "openai/gpt-5.4-mini"
  TRADINGAGENTS_ALLOWED_ORIGINS = ""

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

# TradingAgents pulls in langchain/langgraph + the run state; give it ~1 GB.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
